name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  natives:
    name: ocgcore (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Ubuntu keeps the glibc requirement low for players.
          - name: linux-x86_64
            os: ubuntu-22.04
          - name: windows-x86_64
            os: windows-2022
          - name: macos-universal
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install meson and ninja
        run: python -m pip install meson ninja

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Load MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build ocgcore (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./native/build.ps1

      - name: Build ocgcore (Linux, macOS)
        if: runner.os != 'Windows'
        run: ./native/build.sh

      - name: Test engine against the native library
        shell: bash
        run: ./gradlew :engine:test -PengineOnly

      - uses: actions/upload-artifact@v4
        with:
          name: natives-${{ matrix.name }}
          path: engine/src/main/resources/natives/
          if-no-files-found: error

  mod:
    name: Mod jar
    needs: natives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Collect natives for every platform
        uses: actions/download-artifact@v4
        with:
          pattern: natives-*
          path: engine/src/main/resources/natives/
          merge-multiple: true

      - name: Build
        run: ./gradlew :neoforge:build figuraStarterKit

      - uses: actions/upload-artifact@v4
        with:
          name: minecraftygo-jar
          path: neoforge/build/libs/*.jar
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: figura-starter-kit
          path: build/distributions/*.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: mod
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag against mod_version
        id: version
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mod_version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The changelog section for this version becomes the release notes.
          awk -v v="$version" '/^## / { found = index($0, "## " v) == 1; next } found' CHANGELOG.md > notes.md
          test -s notes.md

      - uses: actions/download-artifact@v4
        with:
          name: minecraftygo-jar
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: figura-starter-kit
          path: dist/

      - uses: softprops/action-gh-release@v2
        with:
          name: MinecraftYGO ${{ steps.version.outputs.version }}
          body_path: notes.md
          prerelease: ${{ startsWith(steps.version.outputs.version, '0.') }}
          files: dist/*
          fail_on_unmatched_files: true
