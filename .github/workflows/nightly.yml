name: nightly

# Long-running engine fuzzing: many random bot duels with the hidden-information oracle and replay checks.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fuzz duels
        run: ./gradlew :engine:test -Pygo.skipMod=true -Pygo.fuzzDuels=1000 --tests '*FuzzDuelTest'
