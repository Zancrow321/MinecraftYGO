org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Mod
mod_id=jadm
mod_name=Just Another Dueling Mod
mod_license=GPL-3.0-only
mod_version=0.1.0
mod_group_id=io.github.zancrow321.jadm
mod_authors=Zancrow321
mod_description=Trading card duels in Minecraft, powered by OCG-Core.

# Minecraft / NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.255
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# Libraries. JNA and Gson ship with Minecraft 1.21.1, so the mod only compiles against them.
jna_version=5.14.0
gson_version=2.10.1
junit_version=5.11.3
# Required at runtime: renders the monster models.
geckolib_version=4.9.3
geckolib_version_range=[4.9,)
# Optional: a Duel Disk slot on the player. Without it the disk is worn in the off hand.
curios_version=9.5.1+1.21.1
curios_version_range=[9.0,)
figura_version=0.1.5+1.21.1
# Optional: server scripts can react to duels, packs, tournaments and ranks.
kubejs_version=2101.7.2-build.377
kubejs_version_range=[2101.7,)
rhino_version=2101.2.7-build.81
