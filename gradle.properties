org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Mod
mod_id=minecraftygo
mod_name=MinecraftYGO
mod_license=GPL-3.0-only
mod_version=0.1.0
mod_group_id=io.github.zancrow321.minecraftygo
mod_authors=Zancrow321
mod_description=Yu-Gi-Oh! duels in Minecraft, powered by OCG-Core.

# Minecraft / NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.255
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# Libraries. JNA and Gson ship with Minecraft 1.21.1, so the mod only compiles against them.
jna_version=5.14.0
gson_version=2.10.1
junit_version=5.11.3
# Required at runtime: renders the monster models.
geckolib_version=4.9.3
geckolib_version_range=[4.9,)
