pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'jadm'

// The engine is plain Java (OCG-Core bindings) and builds without Minecraft.
// Pass -PengineOnly to skip the NeoForge project, e.g. where its maven is unreachable.
include 'engine'
if (!providers.gradleProperty('engineOnly').isPresent()) {
    include 'neoforge'
}
