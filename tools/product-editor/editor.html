<title>JADM Product Editor</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a duel-disk workbench. Left rail = the datapack and its products, middle = the product on the bench,
   right = what the server will see (a sample pack and the JSON file). */
:root {
  --bg: #eef0f5;
  --panel: #ffffff;
  --sunk: #e4e7ef;
  --line: #cfd4e0;
  --fg: #1a1d2b;
  --muted: #5d6479;
  --accent: #9a4b07;
  --accent-fg: #ffffff;
  --accent-soft: #f6e5d2;
  --danger: #b3261e;
  --ok: #1f7a45;
  --r-common: #6f7485;
  --r-rare: #3d6fb6;
  --r-super: #0f8a8a;
  --r-ultra: #a77405;
  --r-secret: #a2399a;
  --font-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12141c; --panel: #1b1e29; --sunk: #232735; --line: #333a4d; --fg: #e8eaf2; --muted: #9aa1b6;
    --accent: #f0a640; --accent-fg: #1a1205; --accent-soft: #3a2a14; --danger: #ff8a80; --ok: #6fd69b;
    --r-common: #a3a8b8; --r-rare: #7fa8ea; --r-super: #4fd1cf; --r-ultra: #f2c14e; --r-secret: #e58ce0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12141c; --panel: #1b1e29; --sunk: #232735; --line: #333a4d; --fg: #e8eaf2; --muted: #9aa1b6;
  --accent: #f0a640; --accent-fg: #1a1205; --accent-soft: #3a2a14; --danger: #ff8a80; --ok: #6fd69b;
  --r-common: #a3a8b8; --r-rare: #7fa8ea; --r-super: #4fd1cf; --r-ultra: #f2c14e; --r-secret: #e58ce0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font-body);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel);
  border-bottom: 1px solid var(--line);
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
}
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand h1 { font: 700 1.25rem/1 var(--font-display); letter-spacing: .02em; margin: 0; text-wrap: balance; }
.brand span { color: var(--muted); font-size: .85rem; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button, .btn {
  font: 500 .9rem var(--font-body); border: 1px solid var(--line); background: var(--panel); color: var(--fg);
  border-radius: var(--radius); padding: 6px 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center;
}
button:hover, .btn:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); padding: 4px 6px; }
button.ghost:hover { color: var(--danger); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .btn:focus-within {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
input, select, textarea {
  font: inherit; color: var(--fg); background: var(--sunk); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 6px 8px; width: 100%; min-width: 0;
}
textarea { font-family: var(--font-mono); font-size: .82rem; resize: vertical; }
label.f { display: grid; gap: 4px; align-content: start; font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
label.f input, label.f select { font-weight: 400; text-transform: none; letter-spacing: 0; font-size: .9rem; }
label.f > small { text-transform: none; letter-spacing: 0; font-weight: 400; }
label.check { display: flex; gap: 8px; align-items: flex-start; font-size: .9rem; }
label.check input { width: auto; margin-top: 3px; }
main.bench {
  display: grid; grid-template-columns: 260px minmax(0, 1fr) 340px; gap: 16px;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  align-items: start;
}
@media (max-width: 1100px) { main.bench { grid-template-columns: 240px minmax(0, 1fr); } aside.out { grid-column: 1 / -1; } }
@media (max-width: 720px) { main.bench { grid-template-columns: minmax(0, 1fr); } header.top { position: static; } }
#filePath { word-break: break-all; }
section.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 12px; min-width: 0; }
h2 { font: 600 .95rem var(--font-display); letter-spacing: .08em; text-transform: uppercase; margin: 0; color: var(--muted); }
h3 { font: 600 1.05rem var(--font-display); margin: 0; }
.rail { display: grid; gap: 16px; min-width: 0; }
.plist { display: grid; gap: 4px; }
.pitem {
  display: grid; grid-template-columns: 30px minmax(0,1fr); gap: 8px; align-items: center; text-align: left; width: 100%;
  border: 1px solid transparent; background: transparent; padding: 6px; border-radius: var(--radius);
}
.pitem[aria-current="true"] { background: var(--accent-soft); border-color: var(--accent); }
.pitem .kind { font: 700 .62rem var(--font-display); letter-spacing: .05em; text-align: center; border-radius: 4px; padding: 4px 0; background: var(--sunk); color: var(--muted); }
.pitem .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; font-weight: 500; }
.pitem .sub { font: .75rem var(--font-mono); color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.adds { display: flex; flex-wrap: wrap; gap: 6px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.search { position: relative; }
.results {
  position: absolute; left: 0; right: 0; top: 100%; z-index: 4; background: var(--panel); border: 1px solid var(--accent);
  border-radius: var(--radius); max-height: 320px; overflow-y: auto; box-shadow: 0 8px 24px rgb(0 0 0 / .18);
}
.results button { width: 100%; border: 0; border-radius: 0; justify-content: space-between; text-align: left; padding: 6px 10px; }
.results button[aria-selected="true"] { background: var(--accent-soft); }
.results code, .mono { font-family: var(--font-mono); font-size: .78rem; color: var(--muted); }
.cards { display: grid; gap: 2px; }
.crow {
  display: grid; grid-template-columns: 34px minmax(0, 1fr) auto auto; gap: 10px; align-items: center;
  padding: 4px 6px; border-radius: var(--radius); background: var(--sunk);
}
.crow img { width: 34px; height: 49px; object-fit: cover; border-radius: 2px; background: var(--line); }
.crow .thumb { width: 34px; height: 49px; border-radius: 2px; background: var(--line); display: grid; place-items: center; font: 700 .6rem var(--font-display); color: var(--muted); }
.crow .cn { min-width: 0; }
.crow .cn b { font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rars { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.rars select { width: auto; padding: 2px 4px; font-size: .8rem; }
.count { width: 64px; }
.chip { font: 600 .72rem var(--font-mono); padding: 1px 6px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.s0 { color: var(--r-common); } .s1 { color: var(--r-rare); } .s2 { color: var(--r-super); } .s3 { color: var(--r-ultra); } .s4 { color: var(--r-secret); }
.stats { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--fg); }
.warn { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: .85rem; }
.warn li { padding: 6px 8px; border-left: 3px solid var(--danger); background: var(--sunk); border-radius: 0 var(--radius) var(--radius) 0; }
.warn li.okay { border-color: var(--ok); }
.pack { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
.pcard { border: 1px solid var(--line); border-radius: 4px; padding: 6px; display: grid; gap: 4px; font-size: .75rem; background: var(--sunk); min-width: 0; }
.pcard .chip { justify-self: start; }
.pcard b { font-weight: 500; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
pre.json { margin: 0; max-height: 420px; overflow: auto; background: var(--sunk); border-radius: var(--radius); padding: 10px; font: .75rem/1.5 var(--font-mono); }
.slots { display: grid; gap: 6px; }
.slot { display: grid; grid-template-columns: 70px minmax(0,1fr) auto; gap: 8px; align-items: center; }
.odds { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; }
.empty { color: var(--muted); font-size: .9rem; padding: 12px; text-align: center; border: 1px dashed var(--line); border-radius: var(--radius); }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: var(--radius); z-index: 20; }
.hint { color: var(--muted); font-size: .85rem; margin: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.packrow { display: grid; grid-template-columns: minmax(0,1fr) 70px auto; gap: 8px; align-items: center; }
details summary { cursor: pointer; font-weight: 500; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top">
  <div class="brand"><h1>JADM Product Editor</h1><span data-t="tagline"></span></div>
  <div class="toolbar">
    <label class="btn" for="importFile"><span data-t="import"></span><input id="importFile" type="file" accept=".zip,.json" multiple hidden></label>
    <button id="newPack" type="button" data-t="newPack"></button>
    <button id="exportZip" class="primary" type="button" data-t="export"></button>
    <select id="lang" aria-label="Language" style="width:auto"><option value="de">Deutsch</option><option value="en">English</option></select>
  </div>
</header>

<main class="bench">
  <div class="rail">
    <section class="panel" id="metaPanel"></section>
    <section class="panel">
      <h2 data-t="products"></h2>
      <div class="plist" id="plist"></div>
      <div class="adds">
        <button type="button" data-add="booster" data-t="addBooster"></button>
        <button type="button" data-add="deck" data-t="addDeck"></button>
        <button type="button" data-add="tin" data-t="addTin"></button>
      </div>
    </section>
  </div>
  <section class="panel" id="editor"></section>
  <aside class="out rail">
    <section class="panel" id="checks"></section>
    <section class="panel" id="sample"></section>
    <section class="panel"><div class="row" style="justify-content:space-between"><h2 data-t="file"></h2><button type="button" id="copyJson" data-t="copy"></button></div><div class="mono" id="filePath"></div><pre class="json" id="json"></pre></section>
  </aside>
</main>

let CARDS = CARD_LIST;
let byCode = new Map(), byName = new Map();
function indexCards() {
  byCode = new Map(); byName = new Map();
  for (const c of CARDS) { byCode.set(c[0], c); byName.set(c[1].toLowerCase(), c); }
}
const cardName = code => byCode.get(code)?.[1] ?? ("#" + code);
const cardCat = code => byCode.get(code)?.[2] ?? "m";
function findCard(ref) {
  if (typeof ref === "number") return byCode.has(ref) ? ref : null;
  const s = String(ref ?? "").trim();
  if (/^\d{1,9}$/.test(s) && byCode.has(+s)) return +s;
  const c = byName.get(s.toLowerCase().replace(/’/g, "'"));
  return c ? c[0] : null;
}
function searchCards(q) {
  q = q.trim().toLowerCase();
  if (q.length < 2) return [];
  if (/^\d+$/.test(q)) return CARDS.filter(c => String(c[0]).startsWith(q)).slice(0, 30);
  const starts = [], has = [];
  for (const c of CARDS) {
    const n = c[1].toLowerCase();
    if (n.startsWith(q)) starts.push(c); else if (n.includes(q)) has.push(c);

    if (!samplePack || samplePack.uid !== p.uid) samplePack = { uid: p.uid, cards: openPack(p) };
    const prof = profileOf(p);
    const { base } = setCards(p);
    $("#sample").innerHTML = `<div class="row" style="justify-content:space-between"><h2>${t("sample")}</h2><button type="button" data-reroll>${t("reroll")}</button></div>
      <div class="stats"><span><b>${prof.size}</b> ${t("perPack")}</span><span>${t("base")} <b class="s${base}">${["Common", "Rare", "Super Rare", "Ultra Rare", "Secret Rare"][base]}</b></span></div>
      <div class="pack">${samplePack.cards.map(c => `<div class="pcard"><b>${esc(cardName(c.code))}</b>${rarityChip(c.rarity)}</div>`).join("")}</div>`;
  } else {
    $("#sample").innerHTML = `<h2>${t("sample")}</h2><p class="hint">${t("sampleNone")}</p>`;
  }
  $("#filePath").textContent = p ? `data/${state.namespace}/jadm/products/${idOf(p)}.json` : "";
  $("#json").textContent = p ? JSON.stringify(productJson(p), null, 2) : "";
}
function renderAll() { applyStatic(); renderMeta(); renderList(); renderEditor(); renderOut(); }
function changed(full) { state.example = state.example && !full; save(); renderList(); renderOut(); if (full) renderEditor(); }

// ---- zip (stored files for writing; stored or deflated for reading)
const CRC = (() => { const tb = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; tb[n] = c >>> 0; } return tb; })();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zip(files) {
  const enc = new TextEncoder(), parts = [], central = []; let offset = 0;
  for (const [name, text] of files) {
    const n = enc.encode(name), d = enc.encode(text), crc = crc32(d);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
    h.setUint16(10, 0, true); h.setUint16(12, 0x21, true); h.setUint32(14, crc, true); h.setUint32(18, d.length, true); h.setUint32(22, d.length, true);
    h.setUint16(26, n.length, true); h.setUint16(28, 0, true);
    parts.push(new Uint8Array(h.buffer), n, d);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
    c.setUint16(12, 0, true); c.setUint16(14, 0x21, true); c.setUint32(16, crc, true); c.setUint32(20, d.length, true); c.setUint32(24, d.length, true);
    c.setUint16(28, n.length, true); c.setUint32(42, offset, true);
    central.push(new Uint8Array(c.buffer), n);
    offset += 30 + n.length + d.length;
  }
  const size = central.reduce((a, b) => a + b.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, size, true); e.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(e.buffer)], { type: "application/zip" });
}
async function unzip(buf) {
  const v = new DataView(buf), out = [];
  let eocd = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) if (v.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error("not a zip");
  let p = v.getUint32(eocd + 16, true); const count = v.getUint16(eocd + 10, true); const dec = new TextDecoder();
  for (let i = 0; i < count; i++) {
    const method = v.getUint16(p + 10, true), csize = v.getUint32(p + 20, true), nlen = v.getUint16(p + 28, true), xlen = v.getUint16(p + 30, true), clen = v.getUint16(p + 32, true), local = v.getUint32(p + 42, true);
    const name = dec.decode(new Uint8Array(buf, p + 46, nlen));
    p += 46 + nlen + xlen + clen;
    if (name.endsWith("/")) continue;
    const start = local + 30 + v.getUint16(local + 26, true) + v.getUint16(local + 28, true);
    let data = new Uint8Array(buf, start, csize);
    if (method === 8) data = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
    else if (method !== 0) continue;
    out.push([name, dec.decode(data)]);
  }
  return out;
}
async function saveFile(name, blob) {
  try {
    const downloads = window.claude?.use ? await window.claude.use("downloads") : null;
    if (downloads) { await downloads.save({ filename: name, data: blob }); toast(t("saved")); return; }
  } catch (e) { if (e && e.code === "declined") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
function exportZip() {
  const ns = /^[a-z0-9_.\-]+$/.test(state.namespace) ? state.namespace : "myserver";
  const files = [["pack.mcmeta", JSON.stringify({ pack: { pack_format: 48, description: state.description || state.name } }, null, 2)]];
  for (const p of state.products) files.push([`data/${ns}/jadm/products/${idOf(p)}.json`, JSON.stringify(productJson(p), null, 2)]);
  saveFile((slug(state.name) || "jadm_products") + ".zip", zip(files));
}
async function importFiles(list) {
  const found = [];
  let meta = null;
  for (const file of list) {
    if (file.name.toLowerCase().endsWith(".zip")) {
      for (const [name, text] of await unzip(await file.arrayBuffer())) {
        const m = name.match(/(?:^|\/)data\/([^/]+)\/jadm\/products\/(.+)\.json$/);
        if (m) { try { found.push([m[1], m[2].replace(/\//g, "_"), JSON.parse(text)]); } catch (e) { /* skip broken file */ } }
        else if (name.endsWith("pack.mcmeta")) { try { meta = JSON.parse(text); } catch (e) { /* ignore */ } }
      }
      if (!meta || !state.example) meta = meta || {};
      meta.fileName = file.name.replace(/\.zip$/i, "");
    } else {
      try { const o = JSON.parse(await file.text()); found.push([null, slug(file.name.replace(/\.json$/i, "")), o]); } catch (e) { /* skip */ }
    }
  }
  if (!found.length) { toast(t("importFail")); return; }
  const fresh = state.example || !state.products.length;
  if (fresh) state = { name: meta?.fileName || "Imported", namespace: found.find(f => f[0])?.[0] || "myserver", description: (typeof meta?.pack?.description === "string" ? meta.pack.description : "") || "", products: [] };
  for (const [, id, o] of found) {
    const p = fromJson(id, o), at = state.products.findIndex(x => idOf(x) === id);
    if (at >= 0) state.products[at] = p; else state.products.push(p);
  }
  selected = Math.max(0, state.products.findIndex(x => idOf(x) === found[0][1]));
  save(); renderAll(); toast(t("imported", { n: found.length }));
}
function toast(msg) { const el = document.createElement("div"); el.className = "toast"; el.textContent = msg; document.body.appendChild(el); setTimeout(() => el.remove(), 2400); }

// ---- adding cards
function addCard(code, opts = {}) {
  const p = current(); if (!p) return;
  const fallback = p.type === "tin" ? "Ultra Rare" : "Common";
  const known = p.cards.find(c => c.code === code);
  const rarity = opts.rarity ? normalRarity(opts.rarity, fallback) : fallback;
  if (known) { if (p.type === "deck") known.count = Math.min(60, known.count + (opts.count || 1)); else if (opts.rarity && !known.rarities.includes(rarity)) known.rarities.push(rarity); }
  else p.cards.push({ code, rarities: [rarity], count: Math.min(60, opts.count || 1) });
}
function bulkAdd(text) {
  let added = 0, missing = [], side = false;
  for (let line of text.split(/\r?\n/)) {
    line = line.trim();
    if (!line) continue;
    if (/^!side/i.test(line)) { side = true; continue; }
    if (/^[#!]/.test(line)) { if (/^#(main|extra)/i.test(line)) side = false; continue; }
    if (side) continue;
    let rarity = null, count = 1;
    const bar = line.split(/\s*[|;]\s*/); line = bar[0]; if (bar[1]) rarity = bar[1];
    let code = findCard(line);
    const m = line.match(/^(\d{1,2})\s*x?\s+(.+)$/i);
    if (code == null && m) { code = findCard(m[2]); count = +m[1]; }
    if (code == null) { missing.push(line); continue; }
    addCard(code, { rarity, count }); added++;
  }
  $("#bulkMsg").textContent = `+${added}` + (missing.length ? ` · ✕ ${missing.slice(0, 5).join(", ")}${missing.length > 5 ? " …" : ""}` : "");
  return added;
}

// ---- events
let results = [], resultIndex = 0;
function showResults() {
  const el = $("#results");
  if (!results.length) { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = results.map((c, i) => `<button type="button" data-pick="${c[0]}" aria-selected="${i === resultIndex}"><span>${esc(c[1])}</span><code>${c[0]}${c[2] === "x" ? " · Extra" : ""}</code></button>`).join("");
}
document.addEventListener("input", e => {
  const el = e.target, p = current();
  if (el.dataset.meta) { state[el.dataset.meta] = el.dataset.meta === "namespace" ? el.value.trim().toLowerCase() : el.value; state.example = false; save(); renderOut(); return; }
  if (!p) return;
  if (el.id === "cardSearch") { results = searchCards(el.value); resultIndex = 0; showResults(); return; }
  if (el.dataset.field) {
    const k = el.dataset.field;
    p[k] = k === "promos" ? Math.max(0, Math.min(10, parseInt(el.value, 10) || 0)) : k === "id" ? el.value.trim().toLowerCase() : el.value;
    if (k === "date" || k === "name") samplePack = null;
    changed(false); return;
  }
  if (el.dataset.count != null) { p.cards[+el.dataset.count].count = Math.max(1, Math.min(60, parseInt(el.value, 10) || 1)); $("#statLine").innerHTML = stats(p); changed(false); return; }
  if (el.dataset.odd) { const [i, k] = el.dataset.odd.split(":"); p.pack.slots[+i][k] = Math.max(0, Math.min(1, parseFloat(el.value) || 0)); samplePack = null; changed(false); return; }
  if (el.dataset.packsize != null) { p.pack.size = Math.max(1, Math.min(30, parseInt(el.value, 10) || 1)); samplePack = null; changed(false); return; }
  if (el.dataset.packprod != null) { p.packs[+el.dataset.packprod].product = el.value.trim(); changed(false); return; }
  if (el.dataset.packcount != null) { p.packs[+el.dataset.packcount].count = Math.max(1, Math.min(24, parseInt(el.value, 10) || 1)); changed(false); return; }
});
document.addEventListener("change", async e => {
  const el = e.target, p = current();
  if (el.id === "lang") { lang = el.value; save(); renderAll(); return; }
  if (el.id === "importFile") { await importFiles([...el.files]); el.value = ""; return; }
  if (el.id === "ydkFile" && el.files[0]) { bulkAdd(await el.files[0].text()); el.value = ""; changed(true); return; }
  if (!p) return;
  if (el.dataset.check) { p[el.dataset.check] = el.checked; changed(false); return; }
  if (el.dataset.rar) { const [ci, ri] = el.dataset.rar.split(":").map(Number); p.cards[ci].rarities[ri] = el.value; samplePack = null; $("#statLine").innerHTML = stats(p); changed(false); return; }
  if (el.dataset.packmode != null) {
    const v = el.value;
    if (v.startsWith("preset:")) { p.pack.mode = "preset"; p.pack.preset = v.slice(7); }
    else if (v === "custom") { const prof = profileOf(p); p.pack.mode = "custom"; if (!p.pack.slots.length) p.pack.slots = ["rare", "foil"]; p.pack.size = p.pack.size || prof.size; }
    else p.pack.mode = "auto";
    samplePack = null; changed(true); return;
  }
  if (el.dataset.slot != null) { const i = +el.dataset.slot; p.pack.slots[i] = el.value === "odds" ? { secret: 0.1, ultra: 0.2, super: 0.3 } : el.value; samplePack = null; changed(true); return; }
});
let confirmNewUntil = 0;
document.addEventListener("click", e => {
  const el = e.target.closest("button"); if (!el) return;
  const p = current(), d = el.dataset;
  if (el.id === "exportZip") return exportZip();
  if (el.id === "copyJson") { const text = $("#json").textContent; navigator.clipboard?.writeText(text).then(() => toast(t("copied")), () => { const r = document.createRange(); r.selectNodeContents($("#json")); getSelection().removeAllRanges(); getSelection().addRange(r); }); return; }
  if (el.id === "newPack") {
    if (Date.now() > confirmNewUntil && !state.example) { confirmNewUntil = Date.now() + 4000; toast(t("confirmNew")); return; }
    state = { name: "My Products", namespace: "myserver", description: "", products: [] }; selected = 0; save(); renderAll(); return;
  }
  if (d.add) { state.products.push(blankProduct(d.add)); selected = state.products.length - 1; state.example = false; save(); renderAll(); $("#fName")?.focus(); return; }
  if (d.select != null) { selected = +d.select; samplePack = null; save(); renderList(); renderEditor(); renderOut(); return; }
  if (d.pick) { addCard(+d.pick); results = []; samplePack = null; changed(true); $("#cardSearch")?.focus(); return; }
  if (!p) return;
  if (d.remove != null) { p.cards.splice(+d.remove, 1); samplePack = null; changed(true); return; }
  if (d.addrar != null) { const c = p.cards[+d.addrar]; const next = RARITIES.find(r => r[2] > Math.max(...c.rarities.map(slotOf))) || RARITIES[RARITIES.length - 2]; c.rarities.push(next[0]); samplePack = null; changed(true); return; }
  if (d.unrar) { const [ci, ri] = d.unrar.split(":").map(Number); p.cards[ci].rarities.splice(ri, 1); samplePack = null; changed(true); return; }
  if (d.addslot != null) { p.pack.slots.push("foil"); samplePack = null; changed(true); return; }
  if (d.unslot != null) { p.pack.slots.splice(+d.unslot, 1); samplePack = null; changed(true); return; }
  if (d.addpack != null) { p.packs.push({ product: "", count: 1 }); changed(true); return; }
  if (d.unpack != null) { p.packs.splice(+d.unpack, 1); changed(true); return; }
  if (d.reroll != null) { samplePack = null; renderOut(); return; }
  if (d.bulk != null) { if (bulkAdd($("#bulkText").value)) { const msg = $("#bulkMsg").textContent; samplePack = null; changed(true); $("#bulkMsg").textContent = msg; } return; }
  if (d.dup != null) { const copy = JSON.parse(JSON.stringify(p)); copy.uid = uid++; copy.id = ""; copy.name = p.name + " (2)"; state.products.splice(selected + 1, 0, copy); selected++; save(); renderAll(); return; }
  if (d.del != null) { state.products.splice(selected, 1); selected = Math.max(0, selected - 1); samplePack = null; save(); renderAll(); return; }
});
document.addEventListener("keydown", e => {
  if (e.target.id !== "cardSearch" || !results.length) return;
  if (e.key === "ArrowDown") { resultIndex = (resultIndex + 1) % results.length; showResults(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { resultIndex = (resultIndex - 1 + results.length) % results.length; showResults(); e.preventDefault(); }
  else if (e.key === "Enter") { addCard(results[resultIndex][0]); results = []; samplePack = null; changed(true); $("#cardSearch")?.focus(); e.preventDefault(); }
  else if (e.key === "Escape") { results = []; showResults(); }
});
document.addEventListener("click", e => { if (!e.target.closest(".search")) { const r = $("#results"); if (r) r.hidden = true; } });

async function start() {
  if (!CARDS.length) { try { CARDS = await (await fetch("cards.json")).json(); } catch (e) { CARDS = []; } }
  indexCards();
  lang = (navigator.language || "en").toLowerCase().startsWith("de") ? "de" : "en";
  load();
  if (selected >= state.products.length) selected = 0;
  renderAll();
}
start();
</script>
